[package]
name = "dioxus-storybook-ui"
version = "0.1.0"
publish = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "The dioxus-storybook manager shell: sidebar, search, keyboard navigation, preview harness and URL state."
keywords = ["dioxus", "storybook", "ui", "components", "wasm"]
categories = ["development-tools", "gui", "wasm"]
readme = "README.md"

[dependencies]
dioxus = { workspace = true }
dioxus-storybook-core = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Location", "History", "Document", "Element", "HtmlElement"] }
wasm-bindgen = "0.2"

[dev-dependencies]
dioxus-ssr = { workspace = true }
